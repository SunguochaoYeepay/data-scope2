<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Favorites - DataScope</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<!-- Navigation -->
<nav class="bg-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between h-16">
      <div class="flex">
        <div class="flex-shrink-0 flex items-center">
          <img alt="DataScope" class="h-8 w-auto" src="/images/logo.png">
        </div>
        <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
          <a class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
             href="#">
            Data Sources
          </a>
          <a class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
             href="#">
            Queries
          </a>
          <a class="border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
             href="#">
            Settings
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Main Content -->
<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
  <!-- Header -->
  <div class="md:flex md:items-center md:justify-between mb-6">
    <div class="flex-1 min-w-0">
      <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
        Favorites
      </h2>
    </div>
    <div class="mt-4 flex md:mt-0 md:ml-4 space-x-3">
      <button class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
              type="button">
        <i class="fas fa-folder-plus mr-2"></i>
        New Folder
      </button>
    </div>
  </div>

  <!-- Search and Filter -->
  <div class="bg-white shadow rounded-lg mb-6">
    <div class="p-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">Search</label>
          <div class="mt-1 relative rounded-md shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <i class="fas fa-search text-gray-400"></i>
            </div>
            <input class="focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md"
                   placeholder="Search favorites..."
                   type="text">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Type</label>
          <select
            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
            <option>All Types</option>
            <option>Queries</option>
            <option>Data Sources</option>
            <option>Tables</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">Sort By</label>
          <select
            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
            <option>Last Accessed</option>
            <option>Name</option>
            <option>Type</option>
            <option>Date Added</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Favorites List -->
  <div class="bg-white shadow overflow-hidden sm:rounded-lg">
    <!-- Folders -->
    <div class="border-b border-gray-200">
      <div class="px-4 py-5 sm:px-6">
        <h3 class="text-lg leading-6 font-medium text-gray-900">Folders</h3>
      </div>
      <ul class="divide-y divide-gray-200">
        <li>
          <div class="px-4 py-4 flex items-center sm:px-6 hover:bg-gray-50 cursor-pointer">
            <div class="min-w-0 flex-1 sm:flex sm:items-center sm:justify-between">
              <div class="flex items-center">
                <i class="fas fa-folder text-yellow-500 mr-3"></i>
                <div>
                  <div class="text-sm font-medium text-indigo-600 truncate">
                    Monthly Reports
                  </div>
                  <div class="mt-1 flex items-center text-sm text-gray-500">
                    <i class="fas fa-list-ul flex-shrink-0 mr-1.5"></i>
                    <p>5 items</p>
                  </div>
                </div>
              </div>
            </div>
            <div class="ml-5 flex-shrink-0">
              <button class="text-gray-400 hover:text-gray-500" type="button">
                <i class="fas fa-ellipsis-v"></i>
              </button>
            </div>
          </div>
        </li>
      </ul>
    </div>

    <!-- Items -->
    <ul class="divide-y divide-gray-200">
      <li>
        <div class="px-4 py-4 flex items-center sm:px-6 hover:bg-gray-50">
          <div class="min-w-0 flex-1 sm:flex sm:items-center sm:justify-between">
            <div>
              <div class="flex items-center">
                <i class="fas fa-file-alt text-indigo-500 mr-3"></i>
                <div class="text-sm font-medium text-indigo-600 truncate">
                  Sales Analysis Query
                </div>
              </div>
              <div class="mt-2 flex">
                <div class="flex items-center text-sm text-gray-500">
                  <i class="fas fa-database flex-shrink-0 mr-1.5"></i>
                  <p>Production DB</p>
                  <i class="fas fa-clock ml-4 flex-shrink-0 mr-1.5"></i>
                  <p>Last accessed 2 days ago</p>
                </div>
              </div>
            </div>
            <div class="mt-4 flex-shrink-0 sm:mt-0 sm:ml-5">
              <div class="flex space-x-2">
                <button class="inline-flex items-center p-2 border border-transparent rounded-full shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                        type="button">
                  <i class="fas fa-external-link-alt"></i>
                </button>
                <button class="inline-flex items-center p-2 border border-transparent rounded-full shadow-sm text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
                        type="button">
                  <i class="fas fa-star-slash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </li>
      <li>
        <div class="px-4 py-4 flex items-center sm:px-6 hover:bg-gray-50">
          <div class="min-w-0 flex-1 sm:flex sm:items-center sm:justify-between">
            <div>
              <div class="flex items-center">
                <i class="fas fa-table text-green-500 mr-3"></i>
                <div class="text-sm font-medium text-indigo-600 truncate">
                  customers
                </div>
              </div>
              <div class="mt-2 flex">
                <div class="flex items-center text-sm text-gray-500">
                  <i class="fas fa-database flex-shrink-0 mr-1.5"></i>
                  <p>Production DB</p>
                  <i class="fas fa-clock ml-4 flex-shrink-0 mr-1.5"></i>
                  <p>Last accessed 1 hour ago</p>
                </div>
              </div>
            </div>
            <div class="mt-4 flex-shrink-0 sm:mt-0 sm:ml-5">
              <div class="flex space-x-2">
                <button class="inline-flex items-center p-2 border border-transparent rounded-full shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                        type="button">
                  <i class="fas fa-external-link-alt"></i>
                </button>
                <button class="inline-flex items-center p-2 border border-transparent rounded-full shadow-sm text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500"
                        type="button">
                  <i class="fas fa-star-slash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </li>
    </ul>
  </div>

  <!-- Pagination -->
  <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6 mt-6 rounded-lg">
    <div class="flex-1 flex justify-between sm:hidden">
      <a class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50"
         href="#">
        Previous
      </a>
      <a class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50"
         href="#">
        Next
      </a>
    </div>
    <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
      <div>
        <p class="text-sm text-gray-700">
          Showing <span class="font-medium">1</span> to <span class="font-medium">10</span> of <span
          class="font-medium">20</span> results
        </p>
      </div>
      <div>
        <nav aria-label="Pagination" class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px">
          <a class="relative inline-flex items-center px-2 py-2 rounded-l-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"
             href="#">
            <span class="sr-only">Previous</span>
            <i class="fas fa-chevron-left"></i>
          </a>
          <a class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50"
             href="#">1</a>
          <a class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50"
             href="#">2</a>
          <a class="relative inline-flex items-center px-4 py-2 border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50"
             href="#">3</a>
          <a class="relative inline-flex items-center px-2 py-2 rounded-r-md border border-gray-300 bg-white text-sm font-medium text-gray-500 hover:bg-gray-50"
             href="#">
            <span class="sr-only">Next</span>
            <i class="fas fa-chevron-right"></i>
          </a>
        </nav>
      </div>
    </div>
  </div>
</main>
</body>
</html>
