<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Query Configuration - DataScope</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<!-- Navigation -->
<nav class="bg-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between h-16">
      <div class="flex">
        <div class="flex-shrink-0 flex items-center">
          <img alt="DataScope" class="h-8 w-auto" src="/images/logo.png">
        </div>
        <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
          <a class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
             href="#">
            Data Sources
          </a>
          <a class="border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
             href="#">
            Queries
          </a>
          <a class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
             href="#">
            Settings
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Main Content -->
<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
  <!-- Header -->
  <div class="md:flex md:items-center md:justify-between mb-6">
    <div class="flex-1 min-w-0">
      <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
        Query Configuration
      </h2>
    </div>
    <div class="mt-4 flex md:mt-0 md:ml-4 space-x-3">
      <button class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
              type="button">
        <i class="fas fa-times mr-2"></i>
        Cancel
      </button>
      <button class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
              type="button">
        <i class="fas fa-save mr-2"></i>
        Save Configuration
      </button>
    </div>
  </div>

  <div class="bg-white shadow rounded-lg">
    <div class="p-6 space-y-6">
      <!-- Query Parameters -->
      <div>
        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Query Parameters</h3>
        <div class="space-y-4">
          <div class="flex items-center justify-between bg-gray-50 p-4 rounded-lg">
            <div class="flex-1">
              <label class="block text-sm font-medium text-gray-700">startDate</label>
              <div class="mt-1 flex items-center">
                <select
                  class="mr-2 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-40 sm:text-sm border-gray-300 rounded-md">
                  <option>Date</option>
                  <option>String</option>
                  <option>Number</option>
                </select>
                <input class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md"
                       placeholder="Parameter Label"
                       type="text">
              </div>
            </div>
            <div class="ml-4 flex items-center space-x-2">
              <label class="inline-flex items-center">
                <input class="rounded border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
                       type="checkbox">
                <span class="ml-2 text-sm text-gray-600">Required</span>
              </label>
              <button class="text-red-600 hover:text-red-700" type="button">
                <i class="fas fa-trash"></i>
              </button>
            </div>
          </div>
          <!-- Add more parameters button -->
          <button class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                  type="button">
            <i class="fas fa-plus mr-2"></i>
            Add Parameter
          </button>
        </div>
      </div>

      <!-- Result Columns -->
      <div class="pt-6">
        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Result Columns</h3>
        <div class="space-y-4">
          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
              <thead class="bg-gray-50">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
                  Column Name
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
                  Display Name
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
                  Data Type
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
                  Display Type
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
                  Mask Type
                </th>
                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
                  Visible
                </th>
                <th class="relative px-6 py-3" scope="col">
                  <span class="sr-only">Actions</span>
                </th>
              </tr>
              </thead>
              <tbody class="bg-white divide-y divide-gray-200">
              <tr>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                  customer_id
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <input class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md"
                         type="text"
                         value="Customer ID">
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                  String
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <select
                    class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md">
                    <option>Text</option>
                    <option>Link</option>
                    <option>Badge</option>
                  </select>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <select
                    class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md">
                    <option>None</option>
                    <option>Full</option>
                    <option>Partial</option>
                  </select>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                  <input checked
                         class="rounded border-gray-300 text-indigo-600 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50"
                         type="checkbox">
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                  <button class="text-indigo-600 hover:text-indigo-900" type="button">
                    <i class="fas fa-arrows-alt"></i>
                  </button>
                </td>
              </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Display Settings -->
      <div class="pt-6">
        <h3 class="text-lg leading-6 font-medium text-gray-900 mb-4">Display Settings</h3>
        <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">
          <div class="sm:col-span-3">
            <label class="block text-sm font-medium text-gray-700">
              Page Size
            </label>
            <div class="mt-1">
              <select
                class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md">
                <option>10</option>
                <option>20</option>
                <option>50</option>
                <option>100</option>
              </select>
            </div>
          </div>

          <div class="sm:col-span-3">
            <label class="block text-sm font-medium text-gray-700">
              Sort By
            </label>
            <div class="mt-1">
              <select
                class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md">
                <option>customer_id ASC</option>
                <option>customer_id DESC</option>
              </select>
            </div>
          </div>

          <div class="sm:col-span-6">
            <div class="flex items-start">
              <div class="flex items-center h-5">
                <input class="focus:ring-indigo-500 h-4 w-4 text-indigo-600 border-gray-300 rounded" type="checkbox">
              </div>
              <div class="ml-3 text-sm">
                <label class="font-medium text-gray-700">Enable Export</label>
                <p class="text-gray-500">Allow users to export query results</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
