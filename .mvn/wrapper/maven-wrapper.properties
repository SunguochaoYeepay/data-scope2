distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.8.6/apache-maven-3.8.6-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.1.1/maven-wrapper-3.1.1.jar

# Maven Wrapper Properties
# https://maven.apache.org/wrapper/

# Distribution URL points to official Maven releases
# Change this URL if you want to use a different Maven version
# Format: distributionUrl=<repository-url>/<group>/<artifact>/<version>/<artifact>-<version>-bin.zip

# Wrapper URL points to the Maven Wrapper JAR
# This JAR contains the logic to download the Maven distribution
# Format: wrapperUrl=<repository-url>/<group>/<artifact>/<version>/<artifact>-<version>.jar

# Checksum verification
# Uncomment and set these properties to enable checksum verification
# distributionSha256Sum=<sha256-sum-of-distribution>
# wrapperSha256Sum=<sha256-sum-of-wrapper>

# Network settings
# Uncomment and modify these properties to configure network settings
# networkTimeout=<timeout-in-milliseconds>
# validateDistribution=true

# Proxy settings
# Uncomment and modify these properties to use a proxy
# httpProxyHost=<proxy-host>
# httpProxyPort=<proxy-port>
# httpProxyUser=<proxy-username>
# httpProxyPassword=<proxy-password>
# httpsProxyHost=<proxy-host>
# httpsProxyPort=<proxy-port>
# httpsProxyUser=<proxy-username>
# httpsProxyPassword=<proxy-password>
# nonProxyHosts=<non-proxy-hosts>

# Local repository
# Uncomment and modify this property to use a different local repository location
# localRepository=${user.home}/.m2/repository

# Logging
# Uncomment and modify these properties to configure logging
# verbose=true
# debug=false