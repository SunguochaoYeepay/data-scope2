spring:
  application:
    name: data-scope
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: DataScopeHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 10000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-threads: 200
    min-spare-threads: 10

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.datascope.domain.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.datascope.app.controller

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.datascope: DEBUG
    org.springframework: INFO
    org.mybatis: INFO
  file:
    name: logs/data-scope.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  datasource:
    max-connections: 100
    query-timeout-seconds: 30
    max-download-records: 50000
  security:
    aes-key: ${AES_KEY:your-aes-key-here}
    salt: ${SALT:your-salt-here}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:your-api-key-here}
    model: mistralai/mistral-7b-instruct
    max-tokens: 1000
  rate-limit:
    max-requests-per-second: 10