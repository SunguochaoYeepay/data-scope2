server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: data-scope
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/data_scope?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.datascope: DEBUG

# Application specific configurations
data-scope:
  # Query rate limit per user (requests per minute)
  query-rate-limit: 60
  # Query timeout in seconds
  query-timeout: 30
  # Maximum download records
  max-download-records: 50000
  # Default page size
  default-page-size: 20
  # Maximum page size
  max-page-size: 100
  # Cache configurations
  cache:
    metadata:
      # Metadata cache time to live in minutes
      ttl: 60
    query:
      # Query result cache time to live in minutes
      ttl: 5
  # Security configurations
  security:
    # AES encryption key for database passwords
    aes-key: your-aes-key-here
    # Salt for password hashing
    password-salt: your-salt-here
  # LLM configurations
  llm:
    # OpenRouter API configurations
    openrouter:
      api-key: your-api-key-here
      model: mistral-7b-instruct
      max-tokens: 1000
      temperature: 0.7