spring:
  application:
    name: data-scope
  datasource:
    url: jdbc:h2:mem:datascope;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.datascope: DEBUG
    org.springframework: INFO
    org.hibernate: INFO
    org.flywaydb: DEBUG
  file:
    name: logs/data-scope.log
    path: logs

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.datascope.domain.**.model,com.datascope.domain.**.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
