spring:
  profiles:
    active: dev
  application:
    name: data-scope
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      idle-timeout: 30000
      pool-name: DataScopeHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  redis:
    timeout: 5000
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.datascope.domain
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
  packages-to-scan: com.datascope.facade.api

server:
  port: 8080
  servlet:
    context-path: /api
  tomcat:
    max-threads: 200
    min-spare-threads: 10
    max-connections: 10000
    connection-timeout: 5000

datascope:
  security:
    encryption:
      algorithm: AES
      key-size: 256
      salt-size: 16
    masking:
      enabled: true
      patterns:
        email: "$$$@***.com"
        phone: "($$$) $$$-****"
        creditCard: "****-****-****-$$$$"
  query:
    timeout: 30
    max-rows: 50000
    rate-limit:
      enabled: true
      max-requests: 100
      time-window: 60
  metadata:
    sync:
      enabled: true
      cron: "0 0 2 * * ?"
      batch-size: 1000
  cache:
    enabled: true
    ttl: 3600
  llm:
    provider: openrouter
    model: gpt-3.5-turbo
    timeout: 10000

logging:
  level:
    root: INFO
    com.datascope: DEBUG
    org.springframework: INFO
    org.mybatis: INFO
  file:
    name: logs/data-scope.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30