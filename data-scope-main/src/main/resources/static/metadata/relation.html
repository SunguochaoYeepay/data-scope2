<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>表关系 - DataScope</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/vis-network.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/vis-network.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<!-- 导航栏 -->
<nav class="bg-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between h-16">
      <div class="flex">
        <div class="flex-shrink-0 flex items-center">
          <img alt="Logo" class="h-8 w-auto" src="https://via.placeholder.com/40">
          <span class="ml-2 text-xl font-semibold">DataScope</span>
        </div>
        <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
          <a
            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
            href="#">
            数据源管理
          </a>
          <a
            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
            href="#">
            查询管理
          </a>
          <a class="border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
             href="#">
            元数据管理
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- 主要内容 -->
<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
  <!-- 面包屑导航 -->
  <div class="mb-6">
    <nav aria-label="Breadcrumb" class="flex">
      <ol class="flex items-center space-x-4">
        <li>
          <div>
            <a class="text-gray-400 hover:text-gray-500" href="#">
              <i class="fas fa-home"></i>
              <span class="sr-only">首页</span>
            </a>
          </div>
        </li>
        <li>
          <div class="flex items-center">
            <i class="fas fa-chevron-right text-gray-400"></i>
            <a class="ml-4 text-sm font-medium text-gray-500 hover:text-gray-700" href="#">元数据管理</a>
          </div>
        </li>
        <li>
          <div class="flex items-center">
            <i class="fas fa-chevron-right text-gray-400"></i>
            <span class="ml-4 text-sm font-medium text-gray-500">表关系</span>
          </div>
        </li>
      </ol>
    </nav>
  </div>

  <!-- 工具栏 -->
  <div class="bg-white shadow px-4 py-5 sm:rounded-lg sm:p-6 mb-6">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">数据源</label>
          <select
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            <option value="1">生产库</option>
            <option value="2">测试库</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">关系类型</label>
          <select
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            <option value="ALL">全部</option>
            <option value="FK">外键关系</option>
            <option value="REFERENCE">推断关系</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">置信度</label>
          <select
            class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            <option value="0">全部</option>
            <option value="0.7">≥70%</option>
            <option value="0.8">≥80%</option>
            <option value="0.9">≥90%</option>
          </select>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <button
          class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
          type="button">
          <i class="fas fa-sync mr-2"></i>
          刷新
        </button>
        <button
          class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50"
          type="button">
          <i class="fas fa-download mr-2"></i>
          导出
        </button>
      </div>
    </div>
  </div>

  <!-- 关系图 -->
  <div class="bg-white shadow sm:rounded-lg">
    <div class="p-6">
      <div class="h-[600px] border border-gray-200 rounded-lg" id="network"></div>
    </div>
  </div>

  <!-- 关系列表 -->
  <div class="mt-6 bg-white shadow sm:rounded-lg">
    <div class="px-4 py-5 sm:px-6">
      <h3 class="text-lg leading-6 font-medium text-gray-900">关系列表</h3>
    </div>
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
            源表
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
            源字段
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
            目标表
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
            目标字段
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
            关系类型
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
            置信度
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider" scope="col">
            操作
          </th>
        </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
        <tr>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
            tbl_orders
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            user_id
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
            tbl_users
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            id
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                <span
                                  class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                                    外键
                                </span>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            100%
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
            <a class="text-indigo-600 hover:text-indigo-900" href="#">编辑</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
  // 初始化关系图
  const container = document.getElementById('network');
  const nodes = new vis.DataSet([
    {id: 1, label: 'tbl_users', title: '用户表'},
    {id: 2, label: 'tbl_orders', title: '订单表'},
    {id: 3, label: 'tbl_products', title: '产品表'}
  ]);
  const edges = new vis.DataSet([
    {from: 2, to: 1, arrows: 'to', label: 'FK', title: 'user_id -> id'},
    {from: 2, to: 3, arrows: 'to', label: 'FK', title: 'product_id -> id'}
  ]);
  const data = {nodes, edges};
  const options = {
    nodes: {
      shape: 'box',
      margin: 10,
      font: {size: 14}
    },
    edges: {
      font: {size: 12}
    },
    physics: {
      enabled: true,
      hierarchicalRepulsion: {
        centralGravity: 0.0,
        springLength: 200,
        springConstant: 0.01,
        nodeDistance: 150
      },
      solver: 'hierarchicalRepulsion'
    }
  };
  const network = new vis.Network(container, data, options);
</script>
</body>
</html>
