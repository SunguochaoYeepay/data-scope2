<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>SQL Query Editor - DataScope</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css" rel="stylesheet">
  <style>
    .CodeMirror {
      height: auto;
      min-height: 200px;
      border: 1px solid #e5e7eb;
      border-radius: 0.375rem;
    }

    .loading-spinner {
      border: 3px solid rgba(156, 163, 175, 0.3);
      border-radius: 50%;
      border-top: 3px solid #6366f1;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
<body class="bg-gray-100">
<!-- Navigation -->
<nav class="bg-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between h-16">
      <div class="flex">
        <div class="flex-shrink-0 flex items-center">
          <a href="/">
            <img alt="DataScope" class="h-8 w-auto" src="/images/logo.png">
          </a>
        </div>
        <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
          <a
            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
            href="/">
            首页
          </a>
          <a
            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
            href="/datasource/list.html">
            数据源
          </a>
          <a class="border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
             href="/query/list.html">
            查询
          </a>
          <a
            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
            href="/settings/index.html">
            设置
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Main Content -->
<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
  <!-- Header -->
  <div class="md:flex md:items-center md:justify-between mb-6">
    <div class="flex-1 min-w-0">
      <div class="flex items-center">
        <input class="text-2xl font-bold text-gray-900 bg-transparent border-0 focus:ring-0 focus:border-0 p-0"
               id="queryName"
               placeholder="查询名称"
               type="text">
        <span class="ml-2 text-gray-500">v1.0</span>
      </div>
    </div>
    <div class="mt-4 flex md:mt-0 md:ml-4 space-x-3">
      <button id="saveButton"
        class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        type="button">
        <i class="fas fa-save mr-2"></i>
        保存
      </button>
      <button id="favoriteButton"
        class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        type="button">
        <i class="fas fa-star mr-2"></i>
        收藏
      </button>
      <button id="executeButton"
        class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        type="button">
        <i class="fas fa-play mr-2"></i>
        执行
      </button>
    </div>
  </div>

  <div class="grid grid-cols-12 gap-6">
    <!-- Left Sidebar - Metadata Browser -->
    <div class="col-span-3">
      <div class="bg-white shadow rounded-lg">
        <div class="p-4 border-b border-gray-200">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-medium text-gray-900">数据源</h3>
            <button class="text-gray-400 hover:text-gray-500" type="button">
              <i class="fas fa-sync"></i>
            </button>
          </div>
          <div class="mt-2">
            <select class="shadow-sm focus:ring-indigo-500 focus:border-indigo-500 block w-full sm:text-sm border-gray-300 rounded-md"
                    id="dataSourceSelect">
              <option value="">选择数据源</option>
            </select>
          </div>
        </div>
        <div class="h-[calc(100vh-20rem)] overflow-y-auto">
          <div class="p-2">
            <!-- Tree View -->
            <ul class="space-y-2" id="metadataTree">
              <!-- 数据源树将通过JavaScript动态加载 -->
            </ul>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Editor Area -->
    <div class="col-span-9 space-y-6">
      <!-- Query Tabs -->
      <div class="bg-white shadow rounded-lg">
        <div class="border-b border-gray-200">
          <nav aria-label="Tabs" class="-mb-px flex">
            <a class="border-indigo-500 text-indigo-600 whitespace-nowrap py-4 px-6 border-b-2 font-medium text-sm"
               href="#">
              SQL 编辑器
            </a>
            <a
              class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-6 border-b-2 font-medium text-sm"
              href="/query/natural.html">
              自然语言
            </a>
            <a
              class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-6 border-b-2 font-medium text-sm"
              href="/query/builder.html">
              查询构建器
            </a>
          </nav>
        </div>
        <div class="p-4">
          <!-- SQL Editor -->
          <textarea class="w-full h-64" id="sqlEditor"></textarea>
        </div>
      </div>

      <!-- Status Message -->
      <div class="bg-blue-50 border-l-4 border-blue-400 p-4 hidden" id="statusMessage">
        <div class="flex">
          <div class="flex-shrink-0">
            <i class="fas fa-info-circle text-blue-400"></i>
          </div>
          <div class="ml-3">
            <p class="text-sm text-blue-700">
              准备执行查询...
            </p>
          </div>
        </div>
      </div>

      <!-- Loading Indicator -->
      <div class="flex justify-center items-center p-4 hidden" id="loadingIndicator">
        <div class="loading-spinner mr-3"></div>
        <span>正在执行查询...</span>
      </div>

      <!-- Results Area -->
      <div class="bg-white shadow rounded-lg hidden" id="resultsTable">
        <div class="border-b border-gray-200 px-4 py-5 sm:px-6">
          <div class="flex items-center justify-between">
            <h3 class="text-lg leading-6 font-medium text-gray-900">
              查询结果
            </h3>
            <div class="flex space-x-3">
              <button id="exportButton"
                class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                type="button">
                <i class="fas fa-download mr-2"></i>
                导出
              </button>
              <button id="configButton"
                class="inline-flex items-center px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
                type="button">
                <i class="fas fa-cog mr-2"></i>
                配置
              </button>
            </div>
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50" id="resultsHeader">
            <!-- 表头将通过JavaScript动态生成 -->
            </thead>
            <tbody class="bg-white divide-y divide-gray-200" id="resultsBody">
            <!-- 表格内容将通过JavaScript动态生成 -->
            </tbody>
          </table>
        </div>
        <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6">
          <div class="flex-1 flex justify-between sm:hidden">
            <a
              class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50"
              href="#">
              上一页
            </a>
            <a
              class="ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50"
              href="#">
              下一页
            </a>
          </div>
          <div class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between">
            <div>
              <p class="text-sm text-gray-700" id="paginationInfo">
                显示 <span class="font-medium">1</span> 到 <span class="font-medium">10</span> 条，共 <span
                class="font-medium">20</span> 条结果
              </p>
            </div>
            <div>
              <nav aria-label="Pagination" class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px"
                   id="paginationContainer">
                <!-- 分页控件将通过JavaScript动态生成 -->
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/sql/sql.min.js"></script>
<script src="/query/js/query-editor.js"></script>
</body>
</html>
