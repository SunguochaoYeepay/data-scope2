<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Data Sources - DataScope</title>
  <link
    href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css"
    rel="stylesheet"
  />
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    rel="stylesheet"
  />
  <script defer src="js/datasource.js"></script>
</head>
<body class="bg-gray-100">
<!-- Navigation -->
<nav class="bg-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between h-16">
      <div class="flex">
        <div class="flex-shrink-0 flex items-center">
          <img alt="DataScope" class="h-8 w-auto" src="/images/logo.png"/>
        </div>
        <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
          <a
            class="border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
            href="#"
          >
            Data Sources
          </a>
          <a
            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
            href="#"
          >
            Queries
          </a>
          <a
            class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium"
            href="#"
          >
            Settings
          </a>
        </div>
      </div>
    </div>
  </div>
</nav>

<!-- Main Content -->
<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
  <!-- Header -->
  <div class="md:flex md:items-center md:justify-between mb-6">
    <div class="flex-1 min-w-0">
      <h2
        class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate"
      >
        Data Sources
      </h2>
    </div>
    <div class="mt-4 flex md:mt-0 md:ml-4">
      <button
        class="ml-3 inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500"
        id="add-datasource-btn"
        type="button"
      >
        <i class="fas fa-plus mr-2"></i>
        Add Data Source
      </button>
    </div>
  </div>

  <!-- Search and Filter -->
  <div class="bg-white shadow rounded-lg mb-6">
    <div class="p-4">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700"
          >Search</label
          >
          <div class="mt-1 relative rounded-md shadow-sm">
            <div
              class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
            >
              <i class="fas fa-search text-gray-400"></i>
            </div>
            <input
              class="focus:ring-indigo-500 focus:border-indigo-500 block w-full pl-10 sm:text-sm border-gray-300 rounded-md"
              id="search-input"
              placeholder="Search data sources..."
              type="text"
            />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700"
          >Type</label
          >
          <select
            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md"
            id="type-filter"
          >
            <option value="">All Types</option>
            <option value="MYSQL">MySQL</option>
            <option value="DB2">DB2</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700"
          >Status</label
          >
          <select
            class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md"
            id="status-filter"
          >
            <option value="">All Status</option>
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
            <option value="ERROR">Error</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- Data Source List -->
  <div class="bg-white shadow overflow-hidden sm:rounded-md">
    <ul class="divide-y divide-gray-200" id="datasource-list">
      <!-- Data sources will be loaded dynamically -->
      <li class="px-4 py-4 flex items-center justify-center">
        <div class="py-8 text-gray-500">
          <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
          <p>Loading data sources...</p>
        </div>
      </li>
    </ul>
  </div>

  <!-- Pagination -->
  <div class="bg-white px-4 py-3 flex items-center justify-between border-t border-gray-200 sm:px-6 mt-6 rounded-lg"
       id="pagination-container"
  >
    <div class="flex-1 flex justify-between sm:hidden">
      <a
        class="pagination-btn relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50"
        data-page="prev"
        href="#"
      >
        Previous
      </a>
      <a
        class="pagination-btn ml-3 relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50"
        data-page="next"
        href="#"
      >
        Next
      </a>
    </div>
    <div
      class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between"
    >
      <div>
        <p class="text-sm text-gray-700" id="pagination-info">
          Loading...
        </p>
      </div>
      <div>
        <nav aria-label="Pagination"
             class="relative z-0 inline-flex rounded-md shadow-sm -space-x-px"
             id="pagination-nav"
        >
          <!-- Pagination will be generated dynamically -->
          <div class="px-4 py-2 text-gray-500">
            <i class="fas fa-spinner fa-spin"></i>
          </div>
        </nav>
      </div>
    </div>
  </div>
</main>
</body>
</html>
