spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:datascope}?useSSL=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: ${REDIS_DATABASE:0}
    password: ${REDIS_PASSWORD:}
    timeout: 10000
    lettuce:
      pool:
        max-active: 16
        max-idle: 16
        min-idle: 8

logging:
  level:
    root: WARN
    com.datascope: INFO
    org.springframework: WARN
  file:
    max-size: 100MB
    max-history: 60

datascope:
  security:
    encryption:
      key: ${ENCRYPTION_KEY}
  llm:
    api-key: ${OPENROUTER_API_KEY}
    endpoint: ${OPENROUTER_ENDPOINT:https://openrouter.ai/api/v1}
  query:
    timeout: 60
    max-rows: 100000
    rate-limit:
      max-requests: 500
      time-window: 60
  metadata:
    sync:
      batch-size: 5000
  cache:
    ttl: 7200

server:
  tomcat:
    max-threads: 400
    min-spare-threads: 20
    max-connections: 20000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    enabled: false