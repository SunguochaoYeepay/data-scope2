spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:data_scope}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DB:0}

logging:
  level:
    root: WARN
    com.datascope: INFO
    org.springframework: WARN
    org.mybatis: WARN
  file:
    name: logs/data-scope.log
    path: logs
    max-size: 100MB
    max-history: 30

app:
  datasource:
    max-connections: ${MAX_CONNECTIONS:50}
    query-timeout-seconds: ${QUERY_TIMEOUT:30}
    max-download-records: ${MAX_DOWNLOAD:50000}
  security:
    aes-key: ${AES_KEY}
    salt: ${SALT}
  openrouter:
    api-key: ${OPENROUTER_API_KEY}
    model: ${OPENROUTER_MODEL:mistralai/mistral-7b-instruct}
    max-tokens: ${MAX_TOKENS:1000}
  rate-limit:
    max-requests-per-second: ${MAX_REQUESTS:10}

springdoc:
  swagger-ui:
    enabled: false
