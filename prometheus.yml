global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "datascope"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets: ["app:8080"]
    basic_auth:
      username: "prometheus"
      password: "prometheus"

  - job_name: "mysql"
    static_configs:
      - targets: ["mysql:9104"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis:9121"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

# Alert rules
rules:
  - alert: HighErrorRate
    expr: rate(http_server_requests_seconds_count{status="5xx"}[5m]) > 0.1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: High error rate detected
      description: Error rate is above 10% for 5 minutes

  - alert: HighResponseTime
    expr: http_server_requests_seconds_sum / http_server_requests_seconds_count > 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High response time detected
      description: Average response time is above 1 second for 5 minutes

  - alert: HighCPUUsage
    expr: process_cpu_usage > 0.8
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High CPU usage detected
      description: CPU usage is above 80% for 5 minutes

  - alert: HighMemoryUsage
    expr: process_resident_memory_bytes / process_memory_max_bytes > 0.8
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High memory usage detected
      description: Memory usage is above 80% for 5 minutes

  - alert: HighDiskUsage
    expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: High disk usage detected
      description: Disk usage is above 90% for 5 minutes

  - alert: InstanceDown
    expr: up == 0
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: Instance down
      description: Instance has been down for more than 5 minutes
